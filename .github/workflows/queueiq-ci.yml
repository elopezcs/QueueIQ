name: QueueIQ CI-CD

on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ dev, staging, main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: queueiq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d queueiq_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/queueiq_ci
      RAG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/queueiq_ci

    defaults:
      run:
        working-directory: Chatbot/backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r ../../requirements.txt
          if [[ "$RUNNER_OS" == "Windows" ]]; then pip install pywin32==311; fi # for Jupyter notebooks
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check . --exclude "*.ipynb" # Skip notebook files

      - name: Run Tests
        run: pytest # Ensures your ML logic isn't broken
