services:
  chatbot-backend:
    build:
      context: .
      dockerfile: Dockerfile.chatbot-backend
    image: mosio7818/queueiq-chatbot-backend:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  chatbot-frontend:
    build:
      context: .
      dockerfile: Dockerfile.chatbot-frontend
    image: mosio7818/queueiq-chatbot-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - chatbot-backend
    restart: unless-stopped

  queuecontrol-manager-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.queuecontrol-dashboard
    image: mosio7818/queueiq-queuecontrol-dashboard:latest
    env_file:
      - .env
    environment:
      - QUEUECONTROL_API_BASE_URL=http://chatbot-backend:8000
    ports:
      - "8501:8501"
    command:
      - python
      - -m
      - streamlit
      - run
      - QueueControl/dashboards/manager_view_dashboard.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
    depends_on:
      - chatbot-backend
    restart: unless-stopped

  queuecontrol-reception-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.queuecontrol-dashboard
    image: mosio7818/queueiq-queuecontrol-dashboard:latest
    env_file:
      - .env
    environment:
      - QUEUECONTROL_API_BASE_URL=http://chatbot-backend:8000
    ports:
      - "8502:8502"
    command:
      - python
      - -m
      - streamlit
      - run
      - QueueControl/dashboards/reception_view_dashboard.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8502"
    depends_on:
      - chatbot-backend
    restart: unless-stopped

  queuecontrol-patient-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.queuecontrol-dashboard
    image: mosio7818/queueiq-queuecontrol-dashboard:latest
    env_file:
      - .env
    environment:
      - QUEUECONTROL_API_BASE_URL=http://chatbot-backend:8000
    ports:
      - "8503:8503"
    command:
      - python
      - -m
      - streamlit
      - run
      - QueueControl/dashboards/patient_view_dashboard.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8503"
    depends_on:
      - chatbot-backend
    restart: unless-stopped

  web:
    build: .
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - RUSH_HOUR_MODEL_FEATURES=${RUSH_HOUR_MODEL_FEATURES}
      - RUSH_HOUR_MODEL_TARGET=${RUSH_HOUR_MODEL_TARGET}
      - RUSH_HOUR_MODEL_HIDDEN_LAYER_SIZES=${RUSH_HOUR_MODEL_HIDDEN_LAYER_SIZES}
      - RUSH_HOUR_MODEL_ACTIVATION=${RUSH_HOUR_MODEL_ACTIVATION}
      - RUSH_HOUR_MODEL_SOLVER=${RUSH_HOUR_MODEL_SOLVER}
      - RUSH_HOUR_MODEL_ALPHA=${RUSH_HOUR_MODEL_ALPHA}
      - RUSH_HOUR_MODEL_BATCH_SIZE=${RUSH_HOUR_MODEL_BATCH_SIZE}
      - RUSH_HOUR_MODEL_LEARNING_RATE_INIT=${RUSH_HOUR_MODEL_LEARNING_RATE_INIT}
      - RUSH_HOUR_MODEL_EPOCHS=${RUSH_HOUR_MODEL_EPOCHS}
      - RUSH_HOUR_MODEL_EARLY_STOPPING=${RUSH_HOUR_MODEL_EARLY_STOPPING}
      - RUSH_HOUR_MODEL_VALIDATION_FRACTION=${RUSH_HOUR_MODEL_VALIDATION_FRACTION}
      - RUSH_HOUR_MODEL_N_ITER_NO_CHANGE=${RUSH_HOUR_MODEL_N_ITER_NO_CHANGE}
      - RUSH_HOUR_MODEL_RANDOM_STATE=${RUSH_HOUR_MODEL_RANDOM_STATE}
      - RUSH_HOUR_MODEL_EXPECTED_ACCURACY=${RUSH_HOUR_MODEL_EXPECTED_ACCURACY}
      - RUSH_HOUR_MODEL_EXPECTED_ROC_AUC=${RUSH_HOUR_MODEL_EXPECTED_ROC_AUC}